name: Compilar Martillo Reparador 26.3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  compilar:
    name: Java 25 + Fabric 0.19.5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Preparar Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compilar para Minecraft 26.3
        run: gradle --no-daemon build --stacktrace
      - name: Publicar archivo JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: Martillo-Reparador-26.3-Fabric
          path: build/libs/*.jar
          if-no-files-found: error
